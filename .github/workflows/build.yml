name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os_name: Linux,   os: ubuntu-24.04   }
          - { os_name: Windows, os: windows-latest }
          - { os_name: macOS,   os: macos-15       }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev \
            libfontconfig1-dev libgl1-mesa-dev

      - name: Configure (JUCE is downloaded automatically)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DNF_COPY_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect VST3
        run: |
          mkdir -p dist
          find build -maxdepth 5 -name "*.vst3" -type d -exec cp -R {} dist/ \;
          ls -la dist

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - dist/*.vst3

      - uses: actions/upload-artifact@v7
        with:
          name: StudioFros-NothingFilter-${{ matrix.os_name }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Zip each platform
        run: |
          cd artifacts
          for d in */; do (cd "$d" && zip -qr "../${d%/}.zip" .); done
          ls -la
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*.zip
          generate_release_notes: true
